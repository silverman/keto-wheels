<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#282828">
<title>keto wheels: vegetarian meal randomizer</title>
<script>try{var r=document.documentElement,t=localStorage.getItem('argento-theme'),p=localStorage.getItem('argento-palette');if(t==='light'||t==='dark')r.setAttribute('data-theme',t);if(p==='gruvbox'||p==='tokyo')r.setAttribute('data-palette',p)}catch(e){}</script>
<link rel="stylesheet" href="vendor/argento/argento.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="ag-app">

<header class="ag-appbar ag-sticky">
  <h1 class="ag-brand">keto wheels <small>vegetarian meal randomizer</small></h1>
  <button id="spin" type="button">spin</button>
  <span class="ag-spacer"></span>
  <div class="ag-input-group">
    <button class="ag-icon-btn ag-theme-toggle" data-ag-theme-toggle type="button" aria-label="toggle light and dark">
      <svg data-icon="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg data-icon="dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="ag-icon-btn ag-palette-toggle" data-ag-palette-toggle type="button" aria-label="toggle warm and cool palette">
      <svg data-icon="warm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5Q12 7 15 3.5L18.6 4.6L22 9.6L17.3 11.4L17.3 21L6.7 21L6.7 11.4L2 9.6L5.4 4.6Z"/></svg>
      <svg data-icon="cool" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5Q12 7 15 3.5L18.6 4.6L22.2 18.2L18.9 20.2L17.3 11.2L17.3 21L6.7 21L6.7 11.2L5.1 20.2L1.8 18.2L5.4 4.6Z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="reels" id="reels" aria-label="wheels"></section>

  <section class="result" aria-live="polite" aria-labelledby="result-h">
    <h2 id="result-h" class="idle">spin to get a meal proposal</h2>
    <p id="result-sub" hidden></p>
  </section>

  <section id="history-wrap" hidden>
    <h3>earlier proposals</h3>
    <ul class="history" id="history"></ul>
  </section>
</main>

<script src="vendor/argento/argento.js"></script>
<script src="app.js"></script>
</body>
</html>
